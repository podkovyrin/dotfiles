# My Ghostty settings, linked to ~/.config/ghostty/config.local. Ghostty reads
# them after the dotkit base (~/.config/ghostty/config), so these win. The
# base has the font, the padding, and the herdr key bindings.

theme = light:One Double Light,dark:One Double Dark

font-family = ""
font-family = "JetBrainsMonoNL Nerd Font"

macos-titlebar-style = hidden
window-inherit-working-directory = false

auto-update = download
auto-update-channel = tip

cursor-style = block
cursor-style-blink = false

copy-on-select = clipboard

clipboard-read = "allow"
clipboard-write = "allow"

shell-integration = zsh
shell-integration-features = no-cursor

window-height = 49
window-width = 177

scrollback-limit = 20000000
