"$schema" = "https://starship.rs/config-schema.json"

# $all renders every module that is not placed elsewhere in a format.
format = "$status$all"
right_format = "$cmd_duration"
add_newline = false

[vcs]
order = ["hg", "pijul", "fossil"]

[git_branch]
symbol = " "
disabled = true

[git_commit]
tag_symbol = "  "
disabled = true

[git_state]
disabled = true

[git_metrics]
disabled = true

[git_status]
disabled = true

[gcloud]
disabled = true

[status]
symbol = " "
disabled = false
format = "[Exit Code: $status]($style)\n"
style = "red"

[directory]
style = "bold cyan"
format = "[$path]($style)[$read_only]($read_only_style) "
truncation_length = 0
truncate_to_repo = false
read_only = " 󰌾"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold green)"

[cmd_duration]
min_time = 0
show_milliseconds = true
format = "[took $duration]($style)"
style = "blue"

# Every other module is dimmed. Each format is wrapped in [...]($style),
# so the joining words ("via", "on", "in") are dimmed too.

[aws]
symbol = " "
format = '[on [$symbol($profile )(\($region\) )(\[$duration\] )]($style)]($style)'
style = "#a0a1a7"

[azure]
symbol = " "
format = '[on [$symbol($subscription)]($style) ]($style)'
style = "#a0a1a7"

[battery]
full_symbol = "󰁹 "
charging_symbol = "󰂄 "
discharging_symbol = "󰂃 "
unknown_symbol = "󰂑 "
empty_symbol = "󰂎 "
format = '[[$symbol$percentage]($style) ]($style)'

[[battery.display]]
threshold = 10
style = "#a0a1a7"

[buf]
symbol = " "
format = '[with [$symbol($version )]($style)]($style)'
style = "#a0a1a7"

[bun]
symbol = " "
format = '[via [$symbol($version )]($style)]($style)'
style = "#a0a1a7"

[c]
symbol = " "
format = '[via [$symbol($version(-$name) )]($style)]($style)'
style = "#a0a1a7"

[claude_context]
format = '[[$gauge $percentage]($style) ]($style)'

[[claude_context.display]]
threshold = 0.0
style = "#a0a1a7"
hidden = true

[[claude_context.display]]
