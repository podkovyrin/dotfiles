# My global fast-moving CLIs, linked to ~/.config/mise/config.toml. The dotkit
# base (~/.config/mise/conf.d/dotkit.toml) has the runtimes (Node, Python,
# Ruby), uv, herdr, and the settings: new releases wait 7 days. Stable CLIs
# and tools that link C libraries belong in nix/packages.txt. Update with
# `dotkit upgrade mise`. Projects pin their own versions in a project mise.toml.
[tools]
"github:modem-dev/hunk" = { version = "latest", minimum_release_age = "1d" }
"npm:@earendil-works/pi-coding-agent" = { version = "latest", minimum_release_age = "1d" }
